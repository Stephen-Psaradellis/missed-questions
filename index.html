<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=400, initial-scale=1" />
  <title>Missed Questions</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
    :root {
      --bg: #121212;
      --bg-overlay: transparent;
      --card-bg: #1e1e1e;
      --card-bg-hover: #2a2a2a;
      --text-primary: #eee;
      --text-secondary: #aaa;
      --accent: #8ab4f8;
      --border-radius: 8px;
      --font-family: 'Inter', sans-serif;
      --transition: 0.15s ease-in-out;
    }
    body {
      margin: 0; padding: 1rem;
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-family);
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #app {
      max-width: 400px;
      margin: auto;
    }
    h1 {
      font-weight: 600;
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
      color: var(--accent);
      user-select: text;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-secondary);
      user-select: text;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.35rem 0.5rem;
      font-size: 1rem;
      border-radius: var(--border-radius);
      border: 1px solid #444;
      background: #222;
      color: var(--text-primary);
      box-sizing: border-box;
      transition: border-color var(--transition);
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    .questions, .answered {
      margin-top: 1rem;
    }
    .list-title {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: var(--accent);
      user-select: text;
    }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 0.7rem 1rem;
      cursor: pointer;
      box-shadow: 0 0 3px rgba(0,0,0,0.7);
      transition: background-color var(--transition);
    }
    .card:hover, .card:focus {
      background: var(--card-bg-hover);
      outline: none;
    }
    .card-content {
      display: flex;
      flex-direction: column;
    }
    .question-text {
      font-weight: 600;
      font-size: 1rem;
      line-height: 1.3;
      color: var(--text-primary);
      word-break: break-word;
      -webkit-font-smoothing: antialiased;
      user-select: text;
    }
    .meta {
      margin-top: 0.3rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      font-variant-numeric: tabular-nums;
      user-select: text;
    }
    .usernames {
      font-style: italic;
      color: var(--accent);
      user-select: text;
    }
    /* Overlay mode fixes */
    #overlay {
      background: transparent;
      margin: 0;
      overflow: hidden;
      max-width: none !important;
      padding: 0.5rem;
    }
    #overlay #channel {
      display: none;
    }
    #overlay .questions {
      display: block /* keep visible so contents show */;
    }
    #overlay .questions > .list-title {
      display: none;
    }
    #overlay .questions:empty::before {
      content: '';
      display: none;
    }
    #overlay .answered,
    #overlay label,
    #overlay h1 {
      display: none;
    }
    #overlay .overlay-question {
      display: block;
      background: transparent !important;
      padding: 0;
      box-shadow: none;
      border-radius: 0;
      font-size: 1.75rem;
      text-align: center;
      user-select: text;
      color: white;
      font-weight: 700;
      text-shadow:
        -2px -2px 3px rgba(0,0,0,0.9),
        2px -2px 3px rgba(0,0,0,0.9),
        -2px 2px 3px rgba(0,0,0,0.9),
        2px 2px 3px rgba(0,0,0,0.9);
    }
    #overlay .overlay-question .question-text {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.2;
      color: inherit;
      text-shadow: inherit;
    }
    #overlay .overlay-question .meta {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>Missed Questions</h1>
    <label for="channel">Channel name:</label>
    <input id="channel" type="text" placeholder="Enter channel name" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
    <div class="questions">
      <div class="list-title">Top Questions</div>
      <div id="questions-list" class="cards" role="list"></div>
    </div>
    <div class="answered" aria-live="polite" aria-atomic="true">
      <div class="list-title">Answered</div>
      <div id="answered-list" class="cards" role="list"></div>
    </div>
  </div>

  <script type="module">
    import { connect } from './chat.js';
    import { QuestionBoard } from './questions.js';

    const params = new URLSearchParams(window.location.search);
    const overlay = params.get('overlay') === '1';
    const channelParam = params.get('channel') || '';

    const app = document.getElementById('app');
    if (overlay) {
      app.id = 'overlay';
      document.body.style.backgroundColor = 'transparent';
      document.body.style.margin = '0';
      document.body.style.overflow = 'hidden';
      app.style.maxWidth = 'none';
      app.style.padding = '0.5rem';
    }

    const channelInput = document.getElementById('channel');
    const questionsList = document.getElementById('questions-list');
    const answeredList = document.getElementById('answered-list');

    const kbAnswerKeys = ['1','2','3','4','5'];
    let qb;
    let currentChannel = '';

    function formatAge(ts) {
      let diff = Math.floor((Date.now() - ts)/1000);
      if(diff < 60) return `${diff}s ago`;
      if(diff < 3600) return `${Math.floor(diff/60)}m ago`;
      if(diff < 86400) return `${Math.floor(diff/3600)}h ago`;
      return `${Math.floor(diff/86400)}d ago`;
    }

    function renderQuestionCard(question, index, isAnswered = false) {
      const card = document.createElement('div');
      card.className = 'card' + (isAnswered ? ' answered-card' : '');
      card.setAttribute('role', 'listitem');
      card.tabIndex = 0;
      card.dataset.id = question.id;
      card.dataset.index = index;
      if (!isAnswered) {
        card.ariaLabel = `Question ${index+1}. ${question.text}. Asked by ${question.count} viewers, first: ${question.users.slice(0,3).join(', ')}. Press ${index+1} to mark as answered.`;
      } else {
        card.ariaLabel = `Answered question. ${question.text}. Undo with click.`;
      }

      card.addEventListener('click', () => {
        if (isAnswered) {
          qb.undo(question.id);
          saveState();
          renderAll();
        } else {
          qb.markAnswered(question.id);
          saveState();
          renderAll();
        }
      });
      card.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          card.click();
        }
      });

      const content = document.createElement('div');
      content.className = 'card-content';

      const textEl = document.createElement('div');
      textEl.className = 'question-text';
      textEl.textContent = question.text;
      content.appendChild(textEl);

      if (!isAnswered) {
        const meta = document.createElement('div');
        meta.className = 'meta';

        const count = document.createElement('div');
        count.textContent = `${question.count} viewer${question.count !== 1 ? 's' : ''}`;

        const names = document.createElement('div');
        names.className = 'usernames';
        names.textContent = question.users.slice(0,3).join(', ');

        const age = document.createElement('div');
        age.textContent = formatAge(question.ts);

        meta.appendChild(count);
        meta.appendChild(names);
        meta.appendChild(age);

        content.appendChild(meta);
      }

      card.appendChild(content);
      return card;
    }

    function renderAll() {
      const topQs = qb.top(5);
      const openQs = topQs; // already filtered and mapped objects
      const answeredQs = qb.answeredList();

      questionsList.innerHTML = '';
      answeredList.innerHTML = '';

      if(overlay) {
        // Show top 1 question large, transparent bg
        questionsList.style.display = 'block';
        answeredList.style.display = 'none';
        if(openQs.length) {
          const top = openQs[0];
          questionsList.innerHTML = '';
          const bigCard = renderQuestionCard(top, 0);
          bigCard.classList.add('overlay-question');
          questionsList.appendChild(bigCard);
        } else {
          questionsList.textContent = ''; // Hide empty text in overlay
        }
      } else {
        questionsList.style.display = 'flex';
        answeredList.style.display = 'flex';

        openQs.forEach((q,i) => {
          questionsList.appendChild(renderQuestionCard(q, i));
        });

        answeredQs.forEach((q,i) => {
          answeredList.appendChild(renderQuestionCard(q, i, true));
        });
      }
    }

    function saveState() {
      localStorage.setItem('missed-questions-data', JSON.stringify(qb.toJSON()));
    }
    function loadState() {
      try {
        const raw = localStorage.getItem('missed-questions-data');
        if(raw) {
          qb.fromJSON(JSON.parse(raw));
        }
      } catch {
        // ignore
      }
    }

    function setupKeyboard() {
      window.addEventListener('keydown', e => {
        if(!currentChannel) return;
        if(!kbAnswerKeys.includes(e.key)) return;
        const ix = kbAnswerKeys.indexOf(e.key);
        const topQs = qb.top(5);
        if(ix < topQs.length) {
          qb.markAnswered(topQs[ix].id);
          saveState();
          renderAll();
        }
      });
    }

    function setChannel(name) {
      if(qb) qb.clear();
      else qb = new QuestionBoard();
      currentChannel = name.toLowerCase().trim();
      if(!currentChannel) return;
      loadState();
      renderAll();
      startChat();
    }

    let wsConn = null;
    let reconnectTimeout = 0;

    function startChat() {
      if(wsConn) {
        wsConn.close();
        wsConn = null;
      }
      if(!currentChannel) return;

      wsConn = connect(currentChannel,
        ({user, text, ts}) => {
          const ch = currentChannel;
          if(user.toLowerCase() === ch) {
            // streamer messages can mark answered by quoting tokens in questions
            const toplist = qb.top(20);
            toplist.forEach(q => {
              if(qb.tokensInText(q.keyTokens, text)) {
                qb.markAnswered(q.id);
              }
            });
            saveState();
            renderAll();
          } else {
            if(qb.add({user, text, ts})) {
              saveState();
              renderAll();
            }
          }
        },
        (status) => {
          if(status === 'DISCONNECTED') {
            reconnectTimeout = Math.min(60000, reconnectTimeout ? reconnectTimeout * 2 : 1000);
            setTimeout(() => {
              startChat();
            }, reconnectTimeout);
          } else if(status === 'CONNECTED') {
            reconnectTimeout = 0;
          }
        });
    }

    channelInput.value = channelParam;
    setChannel(channelParam);

    channelInput.addEventListener('change', e => {
      const val = e.target.value.trim().toLowerCase();
      if(val !== currentChannel) {
        setChannel(val);
      }
    });

    setupKeyboard();
  </script>
  <script type="module" src="./questions.js"></script>
</body>
</html>
